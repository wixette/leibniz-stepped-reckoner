<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leibniz's calculating machine</title>
    <meta name="description" content="Leibniz's stepped reckoner, the first calculating machine for all four operations of arithmetic, as an interactive 3D simulator with guided lessons in English and German." />
    <link rel="stylesheet" href="css/style.css?v=0.0.0" />
    <!-- Every file name here carries the version (?v=), and so does each module the
         scripts import, through this map: bare names ("three") lead to the copies in
         vendor/ (pnpm vendor), and a release asks for new names, so no cache can serve
         an old file to a new page. pnpm version writes them, or pnpm stamp
         (tools/stamp.mjs); do not edit them by hand. -->
    <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js?v=0.0.0",
        "three-mesh-bvh": "./vendor/three-mesh-bvh/build/index.module.js?v=0.0.0",
        "three/addons/controls/OrbitControls.js": "./vendor/three/examples/jsm/controls/OrbitControls.js?v=0.0.0",
        "three/addons/loaders/GLTFLoader.js": "./vendor/three/examples/jsm/loaders/GLTFLoader.js?v=0.0.0",
        "three/addons/utils/BufferGeometryUtils.js": "./vendor/three/examples/jsm/utils/BufferGeometryUtils.js?v=0.0.0",
        "three/addons/utils/SkeletonUtils.js": "./vendor/three/examples/jsm/utils/SkeletonUtils.js?v=0.0.0",
        "./js/accept/collisions.js": "./js/accept/collisions.js?v=0.0.0",
        "./js/accept/harness.js": "./js/accept/harness.js?v=0.0.0",
        "./js/accept/m0Checks.js": "./js/accept/m0Checks.js?v=0.0.0",
        "./js/accept/m1Checks.js": "./js/accept/m1Checks.js?v=0.0.0",
        "./js/accept/m2Checks.js": "./js/accept/m2Checks.js?v=0.0.0",
        "./js/accept/m3Checks.js": "./js/accept/m3Checks.js?v=0.0.0",
        "./js/accept/selftestPanel.js": "./js/accept/selftestPanel.js?v=0.0.0",
        "./js/main.js": "./js/main.js?v=0.0.0",
        "./js/scene/m0Pose.js": "./js/scene/m0Pose.js?v=0.0.0",
        "./js/scene/m1Pose.js": "./js/scene/m1Pose.js?v=0.0.0",
        "./js/scene/m2Pose.js": "./js/scene/m2Pose.js?v=0.0.0",
        "./js/scene/rig.js": "./js/scene/rig.js?v=0.0.0",
        "./js/scene/teachScene.js": "./js/scene/teachScene.js?v=0.0.0",
        "./js/scene/viewer.js": "./js/scene/viewer.js?v=0.0.0",
        "./js/sim/carrySlice.js": "./js/sim/carrySlice.js?v=0.0.0",
        "./js/sim/digitSlice.js": "./js/sim/digitSlice.js?v=0.0.0",
        "./js/sim/kinematics.js": "./js/sim/kinematics.js?v=0.0.0",
        "./js/sim/kinematicsM1.js": "./js/sim/kinematicsM1.js?v=0.0.0",
        "./js/sim/machine.js": "./js/sim/machine.js?v=0.0.0",
        "./js/sim/narrate.js": "./js/sim/narrate.js?v=0.0.0",
        "./js/sim/operations.js": "./js/sim/operations.js?v=0.0.0",
        "./js/teach/i18n.js": "./js/teach/i18n.js?v=0.0.0",
        "./js/teach/lessons.js": "./js/teach/lessons.js?v=0.0.0",
        "./js/teach/partActions.js": "./js/teach/partActions.js?v=0.0.0",
        "./js/teach/partInfo.js": "./js/teach/partInfo.js?v=0.0.0",
        "./js/teach/player.js": "./js/teach/player.js?v=0.0.0",
        "./js/tools/m1Scenarios.js": "./js/tools/m1Scenarios.js?v=0.0.0",
        "./js/tools/m2Scenarios.js": "./js/tools/m2Scenarios.js?v=0.0.0",
        "./params/machine.json": "./params/machine.json?v=0.0.0",
        "./vendor/three-mesh-bvh/build/index.module.js": "./vendor/three-mesh-bvh/build/index.module.js?v=0.0.0",
        "./vendor/three/build/three.core.js": "./vendor/three/build/three.core.js?v=0.0.0",
        "./vendor/three/build/three.module.js": "./vendor/three/build/three.module.js?v=0.0.0",
        "./vendor/three/examples/jsm/controls/OrbitControls.js": "./vendor/three/examples/jsm/controls/OrbitControls.js?v=0.0.0",
        "./vendor/three/examples/jsm/loaders/GLTFLoader.js": "./vendor/three/examples/jsm/loaders/GLTFLoader.js?v=0.0.0",
        "./vendor/three/examples/jsm/utils/BufferGeometryUtils.js": "./vendor/three/examples/jsm/utils/BufferGeometryUtils.js?v=0.0.0",
        "./vendor/three/examples/jsm/utils/SkeletonUtils.js": "./vendor/three/examples/jsm/utils/SkeletonUtils.js?v=0.0.0"
      }
    }
    </script>
  </head>
  <body>
    <main id="stage">
      <div id="hover" hidden></div>
      <div id="status" role="status">Loading model…</div>
      <div id="perf" hidden></div>
    </main>
    <aside id="panel">
      <header>
        <div class="top">
          <h1 data-ui="title"></h1>
          <button id="lang" title="Language / Sprache"></button>
        </div>
        <p class="sub" data-ui="subtitle"></p>
      </header>

      <section>
        <div class="readline">
          <div><label data-ui="result"></label><span class="big" id="result">0</span></div>
          <div><label data-ui="turns"></label><span class="big" id="counter">0</span></div>
          <div><label data-ui="shift"></label><span class="big" id="offset">0</span></div>
        </div>
      </section>

      <section id="menu">
        <h2 data-ui="lessons"></h2>
        <div class="lessonlist" id="lessonlist"></div>
        <div class="lessonlist" style="margin-top: 8px">
          <button id="freeplay"><b data-ui="freePlay"></b><span data-ui="freePlayHint"></span></button>
        </div>
      </section>

      <section id="player" hidden>
        <h2 id="lessonTitle"></h2>
        <div id="progress"></div>
        <p id="stepText"></p>
        <div id="taskline" hidden></div>
        <div class="navrow">
          <button id="back"></button>
          <button id="next" class="primary"></button>
        </div>
        <p style="margin: 8px 0 0"><a href="#" id="toMenu" data-ui="allLessons"></a></p>
      </section>

      <section id="controls" class="controls">
        <div id="lockednote" class="lockednote" hidden></div>
        <div class="inputrow" data-control="input">
          <label data-ui="input" style="font-size: 12px; color: var(--muted); display: block"></label>
          <input id="input" type="number" min="0" max="99999999" value="0" style="width: 160px" />
        </div>
        <div class="row" style="margin-top: 8px">
          <button id="add" data-control="add"></button>
          <button id="sub" data-control="sub"></button>
        </div>
        <div class="row" data-control="shift">
          <button id="shiftLeft"></button>
          <button id="shiftRight"></button>
        </div>
        <div data-control="pin">
          <label data-ui="pin" style="font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px"></label>
          <div class="pins" id="pins"></div>
        </div>
        <div class="row" style="margin-top: 6px">
          <button id="toStop" data-control="toStop"></button>
          <button id="reset" data-control="reset"></button>
        </div>
      </section>

      <section>
        <h2 data-ui="views"></h2>
        <div class="row">
          <button data-view="overview" data-ui="viewOverview"></button>
          <button data-view="register" data-ui="viewRegister"></button>
          <button data-view="front" data-ui="viewFront"></button>
          <button data-view="drum" data-ui="viewDrum"></button>
          <button data-view="carry" data-ui="viewCarry"></button>
        </div>
        <label class="check"><input id="casing" type="checkbox" checked /> <span data-ui="showCase"></span></label>
        <label class="check"><input id="cutaway" type="checkbox" /> <span data-ui="cutaway"></span></label>
        <label class="check"><input id="explode" type="checkbox" /> <span data-ui="explode"></span></label>
        <label class="check"><input id="focus" type="checkbox" /> <span data-ui="focus"></span></label>
      </section>

      <footer>
        <p data-ui="reconstruction"></p>
        <p><a href="dev/" data-ui="morePages"></a></p>
      </footer>
    </aside>
    <script type="module" src="js/main.js?v=0.0.0"></script>
  </body>
</html>
