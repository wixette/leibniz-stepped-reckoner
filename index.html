<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Leibniz's Stepped Reckoner: a 3D simulator with lessons</title>
    <meta name="description" content="Leibniz's stepped reckoner, the first calculating machine for all four operations of arithmetic, as an interactive 3D simulator with a tutorial and lessons." />
    <meta name="theme-color" content="#0f1317" />
    <link rel="icon" href="images/favicon.ico?v=0.0.1" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="images/favicon.svg?v=0.0.1" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=0.0.1" />
    <link rel="manifest" href="manifest.webmanifest?v=0.0.1" />
    <link rel="stylesheet" href="css/fonts.css?v=0.0.1" />
    <link rel="stylesheet" href="css/style.css?v=0.0.1" />
    <!-- Every file name here carries the version (?v=), and so does each module the
         scripts import, through this map: bare names ("three") lead to the copies in
         vendor/ (pnpm vendor), and a release asks for new names, so no cache can serve
         an old file to a new page. pnpm version writes them, or pnpm stamp
         (tools/stamp.mjs); do not edit them by hand. -->
    <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js?v=0.0.1",
        "three-mesh-bvh": "./vendor/three-mesh-bvh/build/index.module.js?v=0.0.1",
        "three/addons/controls/OrbitControls.js": "./vendor/three/examples/jsm/controls/OrbitControls.js?v=0.0.1",
        "three/addons/loaders/GLTFLoader.js": "./vendor/three/examples/jsm/loaders/GLTFLoader.js?v=0.0.1",
        "three/addons/utils/BufferGeometryUtils.js": "./vendor/three/examples/jsm/utils/BufferGeometryUtils.js?v=0.0.1",
        "three/addons/utils/SkeletonUtils.js": "./vendor/three/examples/jsm/utils/SkeletonUtils.js?v=0.0.1",
        "./js/accept/collisions.js": "./js/accept/collisions.js?v=0.0.1",
        "./js/accept/harness.js": "./js/accept/harness.js?v=0.0.1",
        "./js/accept/m0Checks.js": "./js/accept/m0Checks.js?v=0.0.1",
        "./js/accept/m1Checks.js": "./js/accept/m1Checks.js?v=0.0.1",
        "./js/accept/m2Checks.js": "./js/accept/m2Checks.js?v=0.0.1",
        "./js/accept/m3Checks.js": "./js/accept/m3Checks.js?v=0.0.1",
        "./js/accept/selftestPanel.js": "./js/accept/selftestPanel.js?v=0.0.1",
        "./js/app/about.js": "./js/app/about.js?v=0.0.1",
        "./js/app/animator.js": "./js/app/animator.js?v=0.0.1",
        "./js/app/app.js": "./js/app/app.js?v=0.0.1",
        "./js/app/course.js": "./js/app/course.js?v=0.0.1",
        "./js/app/dockHandle.js": "./js/app/dockHandle.js?v=0.0.1",
        "./js/app/references.js": "./js/app/references.js?v=0.0.1",
        "./js/app/sound.js": "./js/app/sound.js?v=0.0.1",
        "./js/app/stage.js": "./js/app/stage.js?v=0.0.1",
        "./js/l10n/all.js": "./js/l10n/all.js?v=0.0.1",
        "./js/l10n/de.js": "./js/l10n/de.js?v=0.0.1",
        "./js/l10n/en.js": "./js/l10n/en.js?v=0.0.1",
        "./js/l10n/es.js": "./js/l10n/es.js?v=0.0.1",
        "./js/l10n/fr.js": "./js/l10n/fr.js?v=0.0.1",
        "./js/l10n/it.js": "./js/l10n/it.js?v=0.0.1",
        "./js/l10n/ja.js": "./js/l10n/ja.js?v=0.0.1",
        "./js/l10n/ko.js": "./js/l10n/ko.js?v=0.0.1",
        "./js/l10n/l10n.js": "./js/l10n/l10n.js?v=0.0.1",
        "./js/l10n/pt-BR.js": "./js/l10n/pt-BR.js?v=0.0.1",
        "./js/l10n/zh-TW.js": "./js/l10n/zh-TW.js?v=0.0.1",
        "./js/l10n/zh.js": "./js/l10n/zh.js?v=0.0.1",
        "./js/main.js": "./js/main.js?v=0.0.1",
        "./js/scene/framing.js": "./js/scene/framing.js?v=0.0.1",
        "./js/scene/m0Pose.js": "./js/scene/m0Pose.js?v=0.0.1",
        "./js/scene/m1Pose.js": "./js/scene/m1Pose.js?v=0.0.1",
        "./js/scene/m2Pose.js": "./js/scene/m2Pose.js?v=0.0.1",
        "./js/scene/rig.js": "./js/scene/rig.js?v=0.0.1",
        "./js/scene/teachScene.js": "./js/scene/teachScene.js?v=0.0.1",
        "./js/scene/viewer.js": "./js/scene/viewer.js?v=0.0.1",
        "./js/sim/carrySlice.js": "./js/sim/carrySlice.js?v=0.0.1",
        "./js/sim/digitSlice.js": "./js/sim/digitSlice.js?v=0.0.1",
        "./js/sim/kinematics.js": "./js/sim/kinematics.js?v=0.0.1",
        "./js/sim/kinematicsM1.js": "./js/sim/kinematicsM1.js?v=0.0.1",
        "./js/sim/machine.js": "./js/sim/machine.js?v=0.0.1",
        "./js/sim/narrate.js": "./js/sim/narrate.js?v=0.0.1",
        "./js/sim/operations.js": "./js/sim/operations.js?v=0.0.1",
        "./js/teach/lessons.js": "./js/teach/lessons.js?v=0.0.1",
        "./js/teach/partActions.js": "./js/teach/partActions.js?v=0.0.1",
        "./js/teach/partInfo.js": "./js/teach/partInfo.js?v=0.0.1",
        "./js/teach/player.js": "./js/teach/player.js?v=0.0.1",
        "./js/teach/tutorial.js": "./js/teach/tutorial.js?v=0.0.1",
        "./js/tools/m1Scenarios.js": "./js/tools/m1Scenarios.js?v=0.0.1",
        "./js/tools/m2Scenarios.js": "./js/tools/m2Scenarios.js?v=0.0.1",
        "./js/ui/components.js": "./js/ui/components.js?v=0.0.1",
        "./package.json": "./package.json?v=0.0.1",
        "./params/machine.json": "./params/machine.json?v=0.0.1",
        "./vendor/material-symbols/icons.js": "./vendor/material-symbols/icons.js?v=0.0.1",
        "./vendor/three-mesh-bvh/build/index.module.js": "./vendor/three-mesh-bvh/build/index.module.js?v=0.0.1",
        "./vendor/three/build/three.core.js": "./vendor/three/build/three.core.js?v=0.0.1",
        "./vendor/three/build/three.module.js": "./vendor/three/build/three.module.js?v=0.0.1",
        "./vendor/three/examples/jsm/controls/OrbitControls.js": "./vendor/three/examples/jsm/controls/OrbitControls.js?v=0.0.1",
        "./vendor/three/examples/jsm/loaders/GLTFLoader.js": "./vendor/three/examples/jsm/loaders/GLTFLoader.js?v=0.0.1",
        "./vendor/three/examples/jsm/utils/BufferGeometryUtils.js": "./vendor/three/examples/jsm/utils/BufferGeometryUtils.js?v=0.0.1",
        "./vendor/three/examples/jsm/utils/SkeletonUtils.js": "./vendor/three/examples/jsm/utils/SkeletonUtils.js?v=0.0.1"
      }
    }
    </script>
  </head>
  <body>
    <!-- The layout is docs/ui-design.md, Part 2: top bar, stage and machine strip, dock,
         status bar. Texts come from js/l10n (data-l10n: text, data-l10n-tip: tooltip and
         screen-reader name); data-icon is replaced by the inline SVG icon. -->
    <header class="topbar">
      <a class="brand" href="./" draggable="false">
        <img src="images/logo-wide.svg?v=0.0.1" alt="" width="64" height="34" draggable="false" />
        <span data-l10n="app.name">Leibniz's Stepped Reckoner</span>
      </a>
      <div class="mode" id="modeBox">
        <button class="chip mode-free" id="modeFree" aria-haspopup="menu" aria-expanded="false" data-l10n-tip="mode.tip.free"><i data-icon="touch_app"></i><span class="mode-label" data-l10n="mode.free">Free play</span><i data-icon="keyboard_arrow_down"></i></button>
        <span class="chip-pair mode-lesson" id="modeLesson" role="group" hidden>
          <button class="chip course" id="modeShow" data-l10n-tip="mode.tip.show" data-tip-describes><i data-icon="school"></i><span class="mode-long" id="modeLong"></span><span class="mode-short" id="modeShort"></span></button>
          <button class="chip" id="modeLeave" data-l10n-tip="mode.tip.leave"><i data-icon="close"></i><span class="txt" data-l10n="mode.leave">Free play</span></button>
        </span>
      </div>
      <div class="spacer"></div>
      <button class="btn icon-only" id="dockBtn" aria-controls="dock" data-l10n-tip="bar.dockHide"><i data-icon="right_panel_close"></i></button>
      <button class="btn lang-btn" id="langBtn" aria-haspopup="menu" data-l10n-tip="bar.language">
        <i data-icon="translate"></i><span id="langShort">EN</span><i data-icon="keyboard_arrow_down"></i>
      </button>
      <button class="btn icon-only" id="aboutBtn" aria-haspopup="dialog" data-l10n-tip="bar.about"><i data-icon="info"></i></button>
    </header>

    <main class="workspace" id="workspace">
      <section class="machine-area">
        <div class="stage" id="stage">
          <div class="stage-top">
            <div class="readouts" aria-live="off">
              <div class="readout result"><label for="resultOut" data-l10n="read.result">Result</label><output id="resultOut">0</output></div>
              <div class="readout"><label for="turnsOut" data-l10n="read.turns">Turns</label><output id="turnsOut">0</output></div>
              <div class="readout"><label for="placeOut" data-l10n="read.place">Carriage</label><output id="placeOut">0</output></div>
            </div>
            <div class="grow"></div>
            <div class="tools" role="group">
              <button class="chip" id="resetViewBtn" data-l10n-tip="tool.resetView"><i data-icon="home"></i></button>
              <span class="chip-pair" role="group">
                <button class="chip" id="zoomOutBtn" data-l10n-tip="tool.zoomOut"><i data-icon="zoom_out"></i></button>
                <button class="chip" id="zoomInBtn" data-l10n-tip="tool.zoomIn"><i data-icon="zoom_in"></i></button>
              </span>
              <button class="chip view-btn" id="viewsBtn" aria-haspopup="menu" aria-expanded="false"><i data-icon="videocam"></i><span class="txt" id="viewName">Whole machine</span><i data-icon="keyboard_arrow_down"></i></button>
            </div>
          </div>
          <div class="stage-bottom">
            <div class="strip" id="strip" role="toolbar">
              <div class="number-field" id="numberField">
                <label for="numInput" data-l10n="strip.number">Number on the knobs</label>
                <input id="numInput" inputmode="numeric" enterkeyhint="done" autocomplete="off" maxlength="8" value="0" data-l10n-tip="strip.number.tip" data-tip-describes />
              </div>
              <span class="sep"></span>
              <div class="pair" role="group">
                <button class="btn tonal has-icon" id="addBtn" data-control="add" data-l10n-tip="strip.add.tip"><i data-icon="rotate_right"></i><span class="sym" aria-hidden="true">+</span></button>
                <button class="btn tonal has-icon" id="subBtn" data-control="sub" data-l10n-tip="strip.sub.tip"><i data-icon="rotate_left"></i><span class="sym" aria-hidden="true">−</span></button>
              </div>
              <span class="sep"></span>
              <div class="split" id="carriageGroup" role="group" aria-labelledby="carriageLabel">
                <button class="btn tonal icon-only" id="leftBtn" data-control="shift" data-l10n-tip="strip.left.tip"><i data-icon="keyboard_double_arrow_left"></i></button>
                <div class="field-group value-field"><span class="field-label" id="carriageLabel" data-l10n="strip.carriage">Carriage</span><output class="carriage-place" id="placeStrip">0</output></div>
                <button class="btn tonal icon-only" id="rightBtn" data-control="shift" data-l10n-tip="strip.right.tip"><i data-icon="keyboard_double_arrow_right"></i></button>
              </div>
              <span class="sep"></span>
              <div class="split" role="group">
                <button class="field-group select-field" id="pinBtn" data-control="pin" aria-haspopup="menu" aria-expanded="false" data-l10n-tip="strip.pin.tip"><span class="field-label" data-l10n="strip.pin">Pin</span><b class="select-value" id="pinValue">–</b><i data-icon="keyboard_arrow_down"></i></button>
                <button class="btn tonal icon-only" id="toStopBtn" data-control="toStop" data-l10n-tip="strip.toStop.tip"><i data-icon="last_page"></i></button>
              </div>
              <span class="sep"></span>
              <button class="btn has-icon" id="resetBtn" data-control="reset" data-l10n-tip="strip.reset.tip" data-tip-describes><i data-icon="restart_alt"></i><span class="txt" data-l10n="strip.reset">Reset</span></button>
              <button class="btn icon-only sound-btn" id="soundBtn"><i data-icon="volume_up"></i></button>
            </div>
          </div>
          <div class="loader" id="loader">
            <div class="bar"><i id="loaderBar"></i></div>
            <div id="loaderText">…</div>
            <noscript>The simulator needs JavaScript. Please turn it on, or use another browser.</noscript>
          </div>
          <div class="hover-label" id="hover" hidden></div>
        </div>
      </section>

      <aside class="dock" id="dock">
        <div class="dock-handle" id="dockHandle" role="separator" tabindex="0" aria-controls="dock" data-l10n-tip="dock.resize"></div>
        <div class="tabs" role="tablist" id="tabs">
          <button class="tab" role="tab" id="tab-start" aria-controls="panel-start" aria-selected="true"><i data-icon="explore"></i><span data-l10n="tab.start">Get started</span><i class="dot" hidden></i></button>
          <button class="tab" role="tab" id="tab-lessons" aria-controls="panel-lessons" aria-selected="false" tabindex="-1"><i data-icon="school"></i><span data-l10n="tab.lessons">Lessons</span><i class="dot" hidden></i></button>
          <button class="tab" role="tab" id="tab-refs" aria-controls="panel-refs" aria-selected="false" tabindex="-1"><i data-icon="menu_book"></i><span data-l10n="tab.refs">References</span></button>
        </div>
        <section class="panel" role="tabpanel" id="panel-start" aria-labelledby="tab-start"></section>
        <section class="panel" role="tabpanel" id="panel-lessons" aria-labelledby="tab-lessons" hidden></section>
        <section class="panel" role="tabpanel" id="panel-refs" aria-labelledby="tab-refs" hidden></section>
      </aside>
    </main>

    <footer class="statusbar">
      <span id="status" role="status" aria-live="polite"></span>
    </footer>

    <dialog id="aboutDialog" aria-labelledby="aboutTitle">
      <div class="dialog-head">
        <h2 class="dialog-title" id="aboutTitle" data-l10n="about.title">About</h2>
        <button class="btn icon-only dialog-close" id="aboutClose" data-l10n-tip="about.close"><i data-icon="close"></i></button>
      </div>
      <div class="dialog-body" id="aboutBody"></div>
    </dialog>

    <!-- A browser too old for the page's modules (import maps, JSON modules) stops before
         main.js runs, which would leave the loader at "…": say so instead. -->
    <script>
      addEventListener("error", () => {
        const text = document.getElementById("loaderText");
        if (text && text.textContent === "…") text.textContent = "This browser cannot run the simulator. Please use a current version of Chrome, Edge, Firefox or Safari.";
      });
    </script>
    <script type="module" src="js/main.js?v=0.0.1"></script>
  </body>
</html>
