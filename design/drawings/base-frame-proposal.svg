<text x="48.0" y="24.0" font-size="14" font-weight="bold">Base frame after K. Badur (Pos. 1), placed under our carriage: side section, front ← → back (y, z in mm)</text>
<text x="40.0" y="500.0" fill="#333">Dashed: today's frame (Lehmann's beams a, b, c; the screw at y −77, z 20). Blue: proposed, from Badur's base-frame sheet and his plan view, its front placed by the result windows.</text>
<text x="40.0" y="518.0" fill="#333">Badur (from the frame's front edge): front rail 4–8 with 8 grooves 36.5 apart; screw ≈ 39–41, ≈ 13.5 up, in Ø15/18 bushes; middle rail 64–72; register frame in U-slots at 73 and 134;</text>
<text x="40.0" y="536.0" fill="#333">rear bar 147–154, between the pentagon rows; upright bars 25 × 8. Heights agree with ours: his carriage frame (25 high, drum shafts at 12.5) on 25-mm rails puts the drum axes at 37.5 (ours 37.875).</text>
<text x="40.0" y="554.0" fill="#333">His register is shallower behind the windows than ours (we made room for the ripple set): the front of his frame is placed by the windows, and his rear bar is our beam c, already between the pentagon rows.</text>
<text x="40.0" y="572.0" fill="#333">Clearances against the carriage's lowest parts: screw top 22.5 under gears at 26.4; front rail top 25 under the counter's star wheel K at 32.7; middle rail 1–2 mm in front of the drums at setting 0.</text>
<text x="40.0" y="590.0" fill="#333">Consequences: beam b and the rear shoes go; the screw drops 6.5 mm, so the blocks under the feet rise 6.5 mm to keep the end crank's handle clear of the board; the catch moves onto the new front foot.</text>
