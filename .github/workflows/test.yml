name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The acceptance tests load the real .glb, which is kept in Git LFS.
          lfs: true
      - uses: pnpm/action-setup@v6 # the version comes from package.json's packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      # Development only: three.js for Node (tests) and TypeScript's checker. The pages
      # use the copies in vendor/, and nothing is built.
      - run: pnpm install --frozen-lockfile
      # Repository-wide: no private references, local paths or broken links
      # (tools/check-refs.mjs).
      - run: pnpm check:refs
      # Every file's licence is declared (REUSE.toml, LICENSES/).
      - uses: fsfe/reuse-action@v6
      # The JSDoc types, checked strictly against the code (tsconfig.json).
      - run: pnpm typecheck
      # Simulator logic, kinematics, acceptance tests on the .glb, vendor/ and the
      # import maps, and the reference check's own tests.
      - run: pnpm test
